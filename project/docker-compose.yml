services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:9000
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=wallet_app
      - DB_USERNAME=wallet_user
      - DB_PASSWORD=wallet_pass
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL:-}
      - SEPOLIA_CONTRACT_ADDRESS=${SEPOLIA_CONTRACT_ADDRESS:-}
      - SEPOLIA_MASTER_ADDRESS=${SEPOLIA_MASTER_ADDRESS:-}
      - SEPOLIA_MASTER_PRIVATE_KEY=${SEPOLIA_MASTER_PRIVATE_KEY:-}

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=wallet_app
      - POSTGRES_USER=wallet_user
      - POSTGRES_PASSWORD=wallet_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_user -d wallet_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
