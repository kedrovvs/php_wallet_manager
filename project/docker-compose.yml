services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - sqlite-data:/app/data
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:9000
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/app/data/database.sqlite
      - SESSION_DRIVER=file
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL:-}
      - SEPOLIA_CONTRACT_ADDRESS=${SEPOLIA_CONTRACT_ADDRESS:-}
      - SEPOLIA_MASTER_ADDRESS=${SEPOLIA_MASTER_ADDRESS:-}
      - SEPOLIA_MASTER_PRIVATE_KEY=${SEPOLIA_MASTER_PRIVATE_KEY:-}

volumes:
  sqlite-data:
